# Учебный кластер: 1 контроллер KRaft и 3 брокера. Модули M02 и M11.
# Отдельный проект Compose (kafka-cluster), не мешает одиночному стенду. Запуск: make cluster-up
# Нужна машина Codespace на 4 ядра / 16 ГБ.
name: kafka-cluster

x-broker-env: &broker-env
  CLUSTER_ID: Q2x1c3RlckNvdXJzZTAx
  KAFKA_CONTROLLER_QUORUM_VOTERS: 100@controller:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 1
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx384m

services:
  controller:
    image: apache/kafka:4.1.1
    container_name: controller
    mem_limit: 700m
    environment:
      CLUSTER_ID: Q2x1c3RlckNvdXJzZTAx
      KAFKA_CONTROLLER_QUORUM_VOTERS: 100@controller:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_NODE_ID: 100
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - controller-data:/var/lib/kafka/data

  kafka-1:
    image: apache/kafka:4.1.1
    container_name: kafka-1
    mem_limit: 900m
    depends_on: [controller]
    ports:
      - "29092:19092"   # с машины Codespace: localhost:29092
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:29092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-2:
    image: apache/kafka:4.1.1
    container_name: kafka-2
    mem_limit: 900m
    depends_on: [controller]
    ports:
      - "29093:19092"   # с машины Codespace: localhost:29093
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29093
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-3:
    image: apache/kafka:4.1.1
    container_name: kafka-3
    mem_limit: 900m
    depends_on: [controller]
    ports:
      - "29094:19092"   # с машины Codespace: localhost:29094
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:29094
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  controller-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
