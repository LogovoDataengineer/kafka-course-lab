# Учебный стенд курса. Запускается командой `make up` из корня репозитория.
# Базовые сервисы (kafka, ui) стартуют всегда, остальные включаются профилями:
#   make up PROFILES=dwh         — добавить PostgreSQL DWH
#   make up PROFILES=schema      — добавить Schema Registry (модуль M06)
#   make up PROFILES="dwh connect" — добавить Kafka Connect (модуль M07)
#   make up PROFILES="dwh connect cdc" — ещё PostgreSQL-источник для Debezium (модуль M08)
#   make up PROFILES=monitoring  — kafka-exporter, Prometheus и Grafana (модуль M10)
#   make up PROFILES="dwh airflow" — Airflow 2.10 со сверкой Kafka и DWH (бонус m14_l03)
name: kafka-course

services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    mem_limit: 1200m
    ports:
      - "19092:19092"   # адрес для программ на машине Codespace: localhost:19092
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 10000   # учебно: проверять сроки хранения раз в 10 с (по умолчанию 5 мин)
      KAFKA_LOG_CLEANER_BACKOFF_MS: 5000             # учебно: compaction проверяет топики раз в 5 с
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: kafka-ui
    mem_limit: 650m
    ports:
      - "18080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: -Xms128m -Xmx384m
      KAFKA_CLUSTERS_0_NAME: course
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"

  dwh:
    profiles: ["dwh"]
    image: postgres:17.6-bookworm
    container_name: dwh
    mem_limit: 384m
    ports:
      - "15433:5432"
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: warehouse
    volumes:
      - dwh-data:/var/lib/postgresql/data
      - ./infra/postgres/dwh.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 20

  source:
    profiles: ["cdc"]
    image: postgres:17.6-bookworm
    container_name: source
    mem_limit: 384m
    ports:
      - "15432:5432"   # база-источник для программ на машине Codespace
    command:
      - postgres
      - -c
      - wal_level=logical             # журнал с данными для логической репликации (CDC)
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=64MB   # предел WAL, который слот может удерживать (урок m08_l03); в проде больше
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: shop
    volumes:
      - source-data:/var/lib/postgresql/data
      - ./infra/postgres/source.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  schema-registry:
    profiles: ["schema"]
    image: confluentinc/cp-schema-registry:8.0.0
    container_name: schema-registry
    mem_limit: 512m
    ports:
      - "18081:8081"   # REST API реестра для программ на машине Codespace: http://localhost:18081
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092   # схемы хранятся в топике _schemas
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  connect:
    profiles: ["connect"]
    image: quay.io/debezium/connect:3.3.0.Final
    container_name: connect
    mem_limit: 1200m
    ports:
      - "18083:8083"   # REST API Connect: http://localhost:18083
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: course-connect                  # все worker с этим id образуют один кластер Connect
      CONFIG_STORAGE_TOPIC: _connect-configs    # конфигурации коннекторов
      OFFSET_STORAGE_TOPIC: _connect-offsets    # позиции source-коннекторов
      STATUS_STORAGE_TOPIC: _connect-status     # статусы коннекторов и задач
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx640m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  kafka-exporter:
    profiles: ["monitoring"]
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    mem_limit: 128m
    command: ["--kafka.server=kafka:9092", "--kafka.version=3.8.0"]   # отдаёт offset и lag групп в формате Prometheus
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    profiles: ["monitoring"]
    image: quay.io/prometheus/prometheus:v3.7.0
    container_name: prometheus
    mem_limit: 384m
    ports:
      - "19090:9090"   # интерфейс и API Prometheus: http://localhost:19090
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.2.0
    container_name: grafana
    mem_limit: 384m
    ports:
      - "13000:3000"   # Grafana: http://localhost:13000, вход без пароля (только просмотр)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/course.json
      GF_PLUGINS_PREINSTALL_DISABLED: "true"   # без интернета не пытаться ставить плагины
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy

  airflow:
    profiles: ["airflow"]
    image: apache/airflow:2.10.5-python3.12
    container_name: airflow
    mem_limit: 3g                                          # планировщик, веб-сервер и процессы задач во время backfill
    # Учебный пользователь admin/admin создаётся при старте; standalone — планировщик и веб-интерфейс в одном контейнере.
    # pid-файлы прошлого запуска удаляются: иначе после перезапуска Codespace веб-сервер считает, что уже работает.
    command: ["bash", "-c", "rm -f /opt/airflow/airflow-*.pid && airflow db migrate >/dev/null && (airflow users create -u admin -p admin -r Admin -f Учебный -l Стенд -e admin@example.com >/dev/null 2>&1 || true) && exec airflow standalone"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /lab/lessons/m14_l03
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "20"     # новые DAG подхватываются за 20 секунд
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__WORKERS: "2"                     # по умолчанию 4 процесса веб-сервера — лишняя память
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "600" # во время backfill машина занята, не гасить веб-сервер
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "600"
      _PIP_ADDITIONAL_REQUIREMENTS: "confluent-kafka==2.12.0"
      AIRFLOW_CONN_DWH: postgres://course:course@dwh:5432/warehouse
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "18088:8080"
    volumes:
      - ./:/lab
      - airflow-home:/opt/airflow
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health | grep -q healthy"]
      interval: 5s
      retries: 120
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  airflow-home:
  kafka-data:
  dwh-data:
  source-data:
